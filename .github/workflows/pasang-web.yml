name: Pasang web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil paket web
        run: |
          curl -fsSL -o web.zip "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/10/11/3675a67a.zip?expires=1791730751&sig=67caca1f7cbac6a07ec896fd335137d3b0bdab01a58c12d9e10831ba939b3d3a"
          mkdir site
          cd site
          unzip -q ../web.zip
          ls -la
          test -f index.html
      - name: Push ke gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pasang KM Talang Kelapa DC v1.7"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
