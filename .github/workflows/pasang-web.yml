name: Pasang web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil paket web
        run: |
          curl -fsSL -o web.zip "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/10/11/830253d3.zip?expires=1791730156&sig=d4f26aa79fe9f7361d64f7cefa08a9b216e4ac6fb3592e34cc222e4a46969ad0"
          mkdir site
          cd site
          unzip -q ../web.zip
          ls -la
          test -f index.html
      - name: Push ke gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pasang KM Talang Kelapa DC v1.6"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
