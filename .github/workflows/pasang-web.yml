name: Pasang web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil paket web
        run: |
          curl -fsSL -o web.zip "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/10/11/9f450b7a.zip?expires=1791728681&sig=45b3a507e380491807a1fe441c6a7cde027d0db24f24e810439f24cd71f9facd"
          mkdir site
          cd site
          unzip -q ../web.zip
          ls -la
          test -f index.html
      - name: Push ke gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pasang KM Talang Kelapa DC v1.5"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
